name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional version label for manual dry-run bundles (e.g. v0.2.0)'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Install cross-compilation toolchain (aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Run Rust test suite on native runner
        if: "!matrix.cross"
        run: cargo test --locked

      - name: Build release binary for ${{ matrix.target }}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${TARGET_TRIPLE}"

      - name: Upload target binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gnome-agent-status
          if-no-files-found: error

  package-and-release:
    name: Package Assets, Attest Provenance & Publish Release
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: blob:none

      - name: Ensure schema and archive tools
        run: |
          if ! command -v glib-compile-schemas >/dev/null 2>&1 || \
             ! command -v node >/dev/null 2>&1 || \
             ! command -v zip >/dev/null 2>&1 || \
             ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libglib2.0-bin nodejs zip unzip
          fi

      - name: Run oxlint, static guardrails, and pure-JS unit tests before packaging
        run: |
          ./scripts/run-oxlint.sh
          ./scripts/check-guardrails.sh
          node --test tests/*.test.mjs

      - name: Download built release binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bin-*

      - name: Resolve and validate release version label
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cargo_ver="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          meta_ver="$(python3 -c 'import json; print(json.load(open("extension/metadata.json", "r", encoding="utf-8"))["version-name"])')"
          if [[ "${cargo_ver}" != "${meta_ver}" ]]; then
            echo "Error: Cargo.toml version (${cargo_ver}) != extension/metadata.json version-name (${meta_ver})" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            if [[ "${ver}" != "v${cargo_ver}" ]]; then
              echo "Error: Git tag ${ver} does not match Cargo.toml/metadata.json v${cargo_ver}" >&2
              exit 1
            fi
          elif [[ -n "${INPUT_TAG}" ]]; then
            ver="${INPUT_TAG}"
          else
            ver="v${cargo_ver}-${GITHUB_SHA::7}"
          fi

          if [[ ! "${ver}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: invalid version tag format '${ver}'" >&2
            exit 1
          fi
          echo "version=${ver}" >> "${GITHUB_OUTPUT}"

      - name: Assemble release tarballs, EGO zip, and SHA256SUMS
        shell: bash
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist aux-assets/completions aux-assets/man

          chmod 0755 \
            artifacts/bin-x86_64-unknown-linux-gnu/gnome-agent-status \
            artifacts/bin-aarch64-unknown-linux-gnu/gnome-agent-status

          NATIVE_BIN="artifacts/bin-x86_64-unknown-linux-gnu/gnome-agent-status"
          "${NATIVE_BIN}" --version

          "${NATIVE_BIN}" completions bash > aux-assets/completions/gnome-agent-status.bash
          "${NATIVE_BIN}" completions zsh > aux-assets/completions/_gnome-agent-status
          "${NATIVE_BIN}" completions fish > aux-assets/completions/gnome-agent-status.fish
          HAS_COMPLETIONS=1

          "${NATIVE_BIN}" manpage > aux-assets/man/gnome-agent-status.1
          HAS_MANPAGE=1

          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            pkg_name="gnome-agent-status-${VER}-${target}"
            stage="stage-tar/${pkg_name}"
            mkdir -p "${stage}"

            install -m 0755 "artifacts/bin-${target}/gnome-agent-status" "${stage}/gnome-agent-status"

            for doc in README.md LICENSE CHANGELOG.md SECURITY.md config.example.toml; do
              if [[ -f "${doc}" ]]; then
                install -m 0644 "${doc}" "${stage}/${doc}"
              fi
            done

            if [[ -d contrib/systemd ]]; then
              mkdir -p "${stage}/systemd"
              cp -f contrib/systemd/* "${stage}/systemd/"
            fi

            if [[ "${HAS_COMPLETIONS}" -eq 1 ]]; then
              mkdir -p "${stage}/completions"
              cp -f aux-assets/completions/* "${stage}/completions/"
            fi

            if [[ "${HAS_MANPAGE}" -eq 1 ]]; then
              mkdir -p "${stage}/man"
              cp -f aux-assets/man/* "${stage}/man/"
            fi

            tar -C stage-tar -czf "dist/${pkg_name}.tar.gz" "${pkg_name}"
          done

          ./scripts/pack-extension.sh --out-dir dist

          (
            cd dist
            sha256sum \
              "gnome-agent-status-${VER}-x86_64-unknown-linux-gnu.tar.gz" \
              "gnome-agent-status-${VER}-aarch64-unknown-linux-gnu.tar.gz" \
              "agent-status@gnome-agent-status.shell-extension.zip" \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.shell-extension.zip
            dist/SHA256SUMS

      - name: Upload release bundle workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/agent-status@gnome-agent-status.shell-extension.zip
            dist/SHA256SUMS
