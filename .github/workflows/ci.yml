name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guardrails-and-js:
    name: Guardrails & JS Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GLib schema tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run static guardrails
        run: ./scripts/check-guardrails.sh

      - name: Run pure-JS unit tests
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(tests/*.test.mjs)
          if (( ${#test_files[@]} > 0 )); then
            node --test "${test_files[@]}"
          else
            echo "No tests/*.test.mjs files present; skipping."
          fi

  rust-suite:
    name: Rust Clippy, Test & CLI Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test --locked

      - name: Build CLI binary for smoke tests
        run: cargo build --locked

      - name: Smoke-test CLI subcommands (doctor, completions, manpage)
        shell: bash
        run: |
          BIN="./target/debug/gnome-agent-status"
          "${BIN}" --version
          help_out="$("${BIN}" --help)"

          if "${BIN}" completions bash >/dev/null 2>&1; then
            for sh_name in bash zsh fish; do
              comp_out="$("${BIN}" completions "${sh_name}")"
              [[ -n "${comp_out}" ]]
            done
          fi

          if "${BIN}" manpage >/dev/null 2>&1; then
            man_out="$("${BIN}" manpage)"
            grep -q '^\.TH ' <<<"${man_out}"
          fi

          if grep -Eq '(^|[[:space:]])doctor([[:space:]]|$)' <<<"${help_out}"; then
            doc_out="$("${BIN}" doctor --json || true)"
            python3 -c 'import json, sys; payload = json.loads(sys.stdin.read()); assert isinstance(payload, dict)' <<<"${doc_out}"
          fi

  security-audit:
    name: Cargo Audit & Deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock for advisories
        run: cargo audit

      - name: Check for deny.toml
        id: check-deny
        run: |
          if [[ -f deny.toml ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run cargo-deny policy check
        if: steps.check-deny.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2

  package-extension:
    name: Package EGO Extension Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install schema, gettext, and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip unzip

      - name: Build and verify EGO extension zip
        run: ./scripts/pack-extension.sh --out-dir target/extension-dist

      - name: Upload extension bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-status-shell-extension
          path: target/extension-dist/agent-status@gnome-agent-status.shell-extension.zip
          if-no-files-found: error
