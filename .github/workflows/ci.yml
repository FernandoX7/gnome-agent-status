name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guardrails-and-js:
    name: Guardrails & JS Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GLib schema tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run static guardrails
        run: ./scripts/check-guardrails.sh

      - name: Run pure-JS unit tests
        run: node --test tests/*.test.mjs

  rust-suite:
    name: Rust Format, Clippy, Test & CLI Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test --locked

      - name: Build CLI binary for smoke tests
        run: cargo build --locked

      - name: Smoke-test CLI subcommands (doctor, completions, manpage)
        shell: bash
        run: |
          set -euo pipefail
          BIN="./target/debug/gnome-agent-status"
          "${BIN}" --version
          "${BIN}" --help >/dev/null

          for sh_name in bash zsh fish; do
            comp_out="$("${BIN}" completions "${sh_name}")"
            [[ -n "${comp_out}" ]]
          done

          man_out="$("${BIN}" manpage)"
          grep -q '^\.TH ' <<<"${man_out}"

          doc_out="$("${BIN}" doctor --json || true)"
          python3 -c 'import json, sys; payload = json.loads(sys.stdin.read()); assert isinstance(payload, dict)' <<<"${doc_out}"

  security-audit:
    name: Cargo Audit & Deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock for advisories
        run: cargo audit

      - name: Run cargo-deny policy check
        uses: EmbarkStudios/cargo-deny-action@v2

  package-extension:
    name: Package EGO Extension Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install schema, gettext, and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip unzip

      - name: Build and verify EGO extension zip
        run: ./scripts/pack-extension.sh --out-dir target/extension-dist

      - name: Upload extension bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-status-shell-extension
          path: target/extension-dist/agent-status@gnome-agent-status.shell-extension.zip
          if-no-files-found: error
