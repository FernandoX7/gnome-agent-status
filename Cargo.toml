[package]
name = "gnome-agent-status"
version = "0.2.0"
edition = "2021"
description = "Multi-provider AI coding agent usage collector for GNOME Shell"
license = "Apache-2.0"
repository = "https://github.com/ToxicBakery/gnome-agent-status"

[dependencies]
anyhow = "1.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
