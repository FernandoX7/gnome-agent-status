[package]
name = "gnome-agent-status"
version = "0.1.0"
edition = "2021"
description = "Parallel CLI agent usage collector (agy & claude) for GNOME Shell top bar"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
