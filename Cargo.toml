[package]
name = "gnome-agent-status"
version = "0.2.0"
edition = "2021"
description = "Multi-provider AI coding agent usage collector for GNOME Shell"
license = "Apache-2.0"
repository = "https://github.com/ToxicBakery/gnome-agent-status"

[dependencies]
aes = "0.9"
anyhow = "1.0"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
pbkdf2 = "0.13"
regex = "1.13"
rusqlite = { version = "0.42", features = ["bundled"] }
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
toml = "1.2"
toml_edit = "0.25"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
