[package]
name = "gnome-agent-status"
version = "0.2.0"
edition = "2021"
description = "Multi-provider AI coding agent usage collector for GNOME Shell"
license = "Apache-2.0"
repository = "https://github.com/ToxicBakery/gnome-agent-status"

[dependencies]
aes = "0.9"
anyhow = "1.0"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
pbkdf2 = "0.13"
regex = "1.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "json"] }
